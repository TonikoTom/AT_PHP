<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
</head>
<body>
    <form action="processar.php" method="post">
    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" name="descricao" required>

    <label for="categoria">Categoria:</label>
    <input type="text" id="categoria" name="categoria" step="0.01" required>

    <label for="valor_compra">Valor de compra:</label>
    <input type="number" id="valor_compra" name="valor_compra" required>

    <label for="valor_venda">Valor de Venda:</label>
    <input type="number" id="valor_venda" name="valor_venda" required>

    <label for="estoque">Quantidade em estoque:</label>
    <input type="number" id="estoque" name="estoque" required>

    <button type="submit">Cadastrar produto</button>
</form>    

<br>
<a href="controle_produto.php">
    Ver produtos cadastrados
</a>

</body>
</html>
